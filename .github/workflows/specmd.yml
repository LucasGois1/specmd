name: SpecMD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Install locked dependencies
        run: 'uv pip install --system --require-hashes --only-binary :all: -r pylock.toml'
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  native-bridges:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: adapters/go/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Install locked dependencies
        run: 'uv pip install --system --require-hashes --only-binary :all: -r pylock.toml'
      - name: Test and build Godog bridge
        working-directory: adapters/go
        run: |
          go test ./...
          go build -o "${RUNNER_TEMP}/specmd-go-example" ./cmd/specmd-example
      - name: Build Cucumber-JVM bridge
        working-directory: adapters/java
        run: |
          bash prepare.sh
          bash build.sh
      - name: Real native engines through the core
        run: |
          python research/workflow/probe_bridges.py \
            --go-executable "${RUNNER_TEMP}/specmd-go-example" \
            --java-runner adapters/java/run.sh \
            --output "${RUNNER_TEMP}/native-bridges.json"
