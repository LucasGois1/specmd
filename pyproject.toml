[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "specmd"
version = "0.3.0"
description = "Canonical Markdown documentation with executable scenarios for coding agents"
requires-python = ">=3.11"
dependencies = [
  "markdown-it-py==4.0.0",
  "PyYAML==6.0.3",
  "behave==1.3.3",
]

[project.scripts]
specmd = "specmd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
